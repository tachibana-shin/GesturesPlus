name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android tools
        run: |
          TOOLS_PATH=$(find $ANDROID_HOME -name zipalign -type f 2>/dev/null | head -1 | xargs dirname)
          echo "Found tools at: $TOOLS_PATH"
          mkdir -p /usr/local/lib/android/sdk/build-tools/29.0.3
          ln -sf "$TOOLS_PATH/zipalign" /usr/local/lib/android/sdk/build-tools/29.0.3/zipalign
          ln -sf "$TOOLS_PATH/apksigner" /usr/local/lib/android/sdk/build-tools/29.0.3/apksigner
          ls -la /usr/local/lib/android/sdk/build-tools/29.0.3/

      - name: Install dependencies
        run: npm install

      - name: Build with Gradle
        run: ./gradlew assembleRelease bundleRelease

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Sign Bundle
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Run Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
